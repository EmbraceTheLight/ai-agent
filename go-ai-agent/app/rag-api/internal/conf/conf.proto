syntax = "proto3";
package kratos.api;

option go_package = "go-ai-agent/app/rag-api/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Model {
    string provider = 1;
    string api_key = 2;
    string base_url = 3;
    string model_name = 4;
  }
  message Mysql {
    string host     = 1;
    string port     = 2;
    string user     = 3;
    string password = 4;
    string database = 5;
    int32 max_idle  = 6;
    int32 max_open  = 7;
    int32 log_level = 8;
  }
  message Milvus {
    string addr = 1;
    string collection = 2;
    string username = 3;
    string password = 4;
  }
  message Embedder {
    string base_url = 1;
    string model = 2;
    int32 dim = 3;
  }
  message Rag {
    string vector_store = 1;
    int32 chunk_size = 2;
    int32 overlap = 3;
    int32 limit_docs = 4;
    int32 limit_chunks = 5;
    repeated string allow_extensions = 6;
  }
  Model model = 1;
  Mysql mysql = 2;
  Milvus milvus = 3;
  Embedder embedder = 4;
  Rag rag = 5;
}
