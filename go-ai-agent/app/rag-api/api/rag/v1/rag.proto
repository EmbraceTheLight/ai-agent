syntax = "proto3";

package rag.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "common/v1/common.proto";

option go_package = "go-ai-agent/app/rag-api/api/rag/v1;ragv1";

service RagService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {get: "/api/v1/health"};
  }

  rpc ImportDocument(ImportDocumentRequest) returns (ImportDocumentResponse) {
    option (google.api.http) = {
      post: "/api/v1/documents/import"
      body: "*"
    };
  }

  rpc Ask(AskRequest) returns (AskResponse) {
    option (google.api.http) = {
      post: "/api/v1/ask"
      body: "*"
    };
  }
}

message HealthRequest {}
message HealthResponse {
  common.v1.CommonResp common_resp = 1;
}

message ImportDocumentRequest {
  string path = 1 [(google.api.field_behavior) = REQUIRED];
}
message ImportDocumentResponse {
  common.v1.CommonResp common_resp = 1;
}

message AskRequest {
  string question = 1 [(google.api.field_behavior) = REQUIRED];
  int32 top_k = 2 [(google.api.field_behavior) = REQUIRED];
}

message AskResponse {
  common.v1.CommonResp common_resp = 1;
  string answer = 2;
  repeated Citation citations = 3;
  repeated SearchResult search_results = 4;
}

message Citation {
  string source_file = 1;
  string title = 2;
  int64 chunk_index = 3;
}

message SearchResult {
  string source_file = 1;
  string title = 2;
  int64 chunk_index = 3;
  double score = 4;
  string content = 5;
}
