server:
  http:
    addr: 0.0.0.0:8000
    timeout: 3s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 3s
data:
  model:
    provider: openai
    api_key: <api_key>
    base_url: <ip:port>
    model_name: gpt-5.6-sol
  milvus:
    addr: <ip:port>
    collection: rag_chunks
    username: <milvus user>
    password: <milvus password>
  embedder:
    base_url: <base_embedding_model_ip:port>
    model: qwen3-embedding:0.6b
    dim: 1024
  rag:
    vector_store: milvus
    chunk_size: 500
    overlap: 100
    limit_docs: 0
    limit_chunks: 0
    allow_extensions:
      - .md
